[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "overground-gui"
version = "1.0.0"
description = "Overground navigation coordinate cue GUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyttsx3>=2.90",
]

[project.scripts]
overground-gui = "overground_gui.app:main"

[tool.setuptools.packages.find]
include = ["overground_gui*"]
